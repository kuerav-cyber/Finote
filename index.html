<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finote — Finhub</title>
<style>
:root{
  --bg:#f4f4f5;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --accent:#2563eb;
  --border:#e5e7eb;
}
body.theme-violet{ --bg:#f3e8ff; --card:#ffffff; --text:#1e1b4b; --muted:#6b21a8; --accent:#7c3aed; --border:#e9d5ff; }
body.theme-blue{ --bg:#e0f2fe; --card:#ffffff; --text:#0c4a6e; --muted:#0369a1; --accent:#0284c7; --border:#bae6fd; }
body.theme-mint{ --bg:#dcfce7; --card:#ffffff; --text:#14532d; --muted:#15803d; --accent:#16a34a; --border:#bbf7d0; }
body.theme-dark{ --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#9ca3af; --accent:#3b82f6; --border:#374151; }

*{box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  margin:0;
  padding:14px;
  transition:background .2s,color .2s;
}
.wrap{max-width:520px;margin:auto}
.box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
input,select,button{
  width:100%;
  padding:10px 12px;
  margin-top:8px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:15px;
  background:var(--card);
  color:var(--text);
}
button{
  background:var(--accent);
  color:#fff;
  border:none;
  font-weight:700;
  cursor:pointer;
}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{background:var(--border);color:var(--text)}
.btn-red{background:#dc2626;color:#fff}
.btn-sm{width:auto;padding:5px 9px;margin:0;font-size:12px}
.row-flex{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avatar{
  width:42px;height:42px;border-radius:50%;
  object-fit:cover;border:2px solid var(--accent);background:#ddd;flex-shrink:0;
}
.menu-btn{width:auto;padding:8px 12px;margin:0;font-size:18px;line-height:1}
.drawer{
  position:fixed;top:0;right:0;width:86%;max-width:340px;height:100%;
  background:var(--card);border-left:1px solid var(--border);
  z-index:50;padding:16px;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.18);
}
.backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;
}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:60;
}
.modal-card{
  width:100%;max-width:440px;background:var(--card);
  border-radius:14px;padding:16px;border:1px solid var(--border);max-height:90vh;overflow-y:auto;
}
.item{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);gap:8px;
}
.small{font-size:12px;color:var(--muted)}
.in{color:#16a34a;font-weight:700}
.out{color:#dc2626;font-weight:700}
.big{font-size:20px;font-weight:800;margin-top:4px}
.badge-lock{
  font-size:11px;padding:2px 7px;border-radius:999px;
  background:#fee2e2;color:#b91c1c;font-weight:700;
}
.receipt-preview{
  max-width:100%;max-height:360px;border-radius:10px;display:block;margin:8px auto 0;border:1px solid var(--border);
}
.hide{display:none !important}
</style>
</head>
