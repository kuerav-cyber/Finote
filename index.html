<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Transaksi Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0088cc',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #eef7fc;
        }
        .card-box {
            background-color: #ffffff;
            border: 1.5px solid #d0e8f8;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.05);
        }
    </style>
</head>
<body class="p-4 sm:p-6 min-h-screen max-w-lg mx-auto pb-20">

    <!-- Header Ringkasan Saldo -->
    <div class="card-box p-5 mb-5 text-center bg-gradient-to-br from-white to-sky-50">
        <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Saldo Kas Saat Ini</span>
        <h1 id="total-saldo-display" class="text-3xl font-extrabold text-slate-800 mt-1">Rp 0</h1>
    </div>

    <!-- 1. Form Input Transaksi -->
    <div class="card-box p-5 mb-5">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <span>Tambah Transaksi Baru</span>
        </h2>
        
        <form id="form-transaksi" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Transaksi / Keperluan</label>
                <input type="text" id="deskripsi" placeholder="Contoh: Makan malam, Penjualan barang" required 
                       class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Transaksi</label>
                    <select id="jenis" required class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                        <option value="Keluar">Pengeluaran (Keluar)</option>
                        <option value="Masuk">Pemasukan (Masuk)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Akun / Bank</label>
                    <select id="akun" required class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                        <option value="BCA">BCA</option>
                        <option value="Tunai">Tunai / Cash</option>
                        <option value="Mandiri">Mandiri</option>
                        <option value="BRI">BRI</option>
                        <option value="E-Wallet">E-Wallet</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nominal Transaksi (Rp)</label>
                <input type="number" id="nominal" placeholder="0" min="1" required 
                       class="w-full px-3 py-2.5 text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Bukti / Struk (Opsional):</label>
                <input type="file" id="bukti-file" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer border border-slate-200 rounded-xl p-1">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] transition-all text-white font-bold rounded-xl shadow-md text-sm mt-2">
                Simpan Transaksi
            </button>
        </form>
    </div>

    <!-- 2. Lihat Data Pemasukan & Pengeluaran -->
    <div class="card-box p-5 mb-5">
        <div class="flex justify-between items-start mb-3">
            <h2 class="text-base font-bold text-slate-800 leading-tight">Lihat Data Pemasukan &amp; Pengeluaran</h2>
            <span class="text-xs text-brand-600 font-medium bg-brand-50 px-2 py-1 rounded-md border border-brand-100 whitespace-nowrap">Mode baca saja</span>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <select id="filter-jenis" onchange="renderSemuaData()" class="px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none bg-white font-medium text-slate-700">
                <option value="Semua">Semua</option>
                <option value="Masuk font-semibold">Pemasukan</option>
                <option value="Keluar">Pengeluaran</option>
            </select>
            <input type="date" id="filter-tanggal" onchange="renderSemuaData()" class="px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none bg-white text-slate-700">
        </div>

        <button onclick="resetFilterTanggal()" class="w-full py-2.5 px-4 bg-sky-200 hover:bg-sky-300 text-sky-900 font-bold rounded-xl text-xs transition-colors mb-4">
            Tampilkan Semua Tanggal
        </button>

        <!-- Container Daftar Semua Data -->
        <div id="container-semua-data" class="space-y-3">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- 3. Kelola Transaksi Hari Ini -->
    <div class="card-box p-5 mb-5">
        <h2 class="text-base font-bold text-slate-800 mb-3">Kelola Transaksi Hari Ini</h2>
        <!-- Teks keterangan terkunci sengaja dihapus sesuai permintaan -->

        <!-- Container Transaksi Hari Ini -->
        <div id="container-hari-ini" class="space-y-3">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- 4. Daily Closing (23:59:59) -->
    <div class="card-box p-5 mb-6">
        <h2 class="text-base font-bold text-slate-800 mb-3">Daily Closing (23:59:59)</h2>
        
        <button onclick="prosesClosing()" 
                class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] transition-all text-white font-bold rounded-xl shadow-md text-sm mb-3">
            Tutup Hari Ini Sekarang
        </button>

        <p id="status-closing" class="text-xs font-medium text-slate-500">Belum ada closing.</p>
    </div>

    <!-- Footer Credit Banner -->
    <div class="text-center">
        <span class="inline-block px-4 py-1.5 bg-white border border-slate-200 text-xs font-semibold text-slate-600 rounded-full shadow-sm">
            kuerav-cyber.github.io
        </span>
    </div>

    <!-- Custom Notification Toast (Tanpa Alert) -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-3 rounded-xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50">
        Pesan Notifikasi
    </div>

    <script>
        // Logika Data & State
        let transaksiData = JSON.parse(localStorage.getItem('app_transaksi_kas')) || [
            {
                id: 1700753317000,
                deskripsi: 'Makan malam',
                jenis: 'Keluar',
                akun: 'BCA',
                nominal: 37000,
                waktu: getTodayISOString() + ' • 23:28:37',
                tanggalISO: getTodayISOString()
            }
        ];

        let statusClosingText = localStorage.getItem('app_status_closing') || 'Belum ada closing.';

        // Inisialisasi Saat Halaman Load
        window.onload = function() {
            renderSemuaData();
            renderHariIni();
            updateTotalSaldo();
            document.getElementById('status-closing').innerText = statusClosingText;
        };

        // Mendapatkan Tanggal Hari Ini Format YYYY-MM-DD
        function getTodayISOString() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Helper Format Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka).replace('Rp', 'Rp ');
        }

        // Toast Notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Simpan Data Ke LocalStorage
        function saveData() {
            localStorage.setItem('app_transaksi_kas', JSON.stringify(transaksiData));
            updateTotalSaldo();
        }

        // Menghitung Total Saldo (Logika background penambahan/pengurangan berjalan di sini)
        function updateTotalSaldo() {
            const total = transaksiData.reduce((acc, item) => {
                if (item.jenis === 'Masuk') {
                    return acc + item.nominal;
                } else {
                    return acc - item.nominal;
                }
            }, 0);
            
            document.getElementById('total-saldo-display').innerText = formatRupiah(total);
        }

        // Handle Form Submit
        document.getElementById('form-transaksi').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const deskripsi = document.getElementById('deskripsi').value.trim();
            const jenis = document.getElementById('jenis').value;
            const akun = document.getElementById('akun').value;
            const nominal = parseFloat(document.getElementById('nominal').value);
            
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            const todayISO = getTodayISOString();

            const newTransaksi = {
                id: Date.now(),
                deskripsi: deskripsi,
                jenis: jenis,
                akun: akun,
                nominal: nominal,
                waktu: `${todayISO} • ${timeString}`,
                tanggalISO: todayISO
            };

            transaksiData.unshift(newTransaksi);
            saveData();

            renderSemuaData();
            renderHariIni();

            // Reset Form
            this.reset();
            showToast("Transaksi berhasil disimpan!");
        });

        // Render Section "Lihat Data Pemasukan & Pengeluaran"
        function renderSemuaData() {
            const container = document.getElementById('container-semua-data');
            const filterJenis = document.getElementById('filter-jenis').value;
            const filterTanggal = document.getElementById('filter-tanggal').value;

            container.innerHTML = '';

            let filtered = transaksiData.filter(item => {
                let matchJenis = (filterJenis === 'Semua') || (item.jenis === filterJenis);
                let matchTanggal = !filterTanggal || (item.tanggalISO === filterTanggal);
                return matchJenis && matchTanggal;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Tidak ada data transaksi.</p>`;
                return;
            }

            filtered.forEach(item => {
                const isKeluar = item.jenis === 'Keluar';
                const sign = isKeluar ? '- ' : '+ ';
                const colorClass = isKeluar ? 'text-red-500' : 'text-emerald-600';

                const html = `
                    <div class="py-2.5 border-b border-slate-100 last:border-0 flex justify-between items-start">
                        <div>
                            <div class="font-bold text-slate-800 text-sm sm:text-base">
                                ${item.deskripsi} <span class="text-xs font-normal text-slate-500">(${item.akun} • ${item.jenis})</span>
                            </div>
                            <div class="text-xs text-slate-400 font-mono mt-0.5">${item.waktu}</div>
                        </div>
                        <div class="font-bold ${colorClass} text-sm sm:text-base whitespace-nowrap">
                            ${sign}${formatRupiah(item.nominal)}
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function resetFilterTanggal() {
            document.getElementById('filter-tanggal').value = '';
            document.getElementById('filter-jenis').value = 'Semua';
            renderSemuaData();
        }

        // Render Section "Kelola Transaksi Hari Ini"
        function renderHariIni() {
            const container = document.getElementById('container-hari-ini');
            const todayISO = getTodayISOString();

            // Logika Penguncian: Hanya ambil data yang tanggalnya = HARI INI
            const dataHariIni = transaksiData.filter(item => item.tanggalISO === todayISO);

            container.innerHTML = '';

            if (dataHariIni.length === 0) {
                container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada transaksi hari ini.</p>`;
                return;
            }

            dataHariIni.forEach(item => {
                const isKeluar = item.jenis === 'Keluar';
                const sign = isKeluar ? '- ' : '+ ';
                const colorClass = isKeluar ? 'text-red-500' : 'text-emerald-600';

                const html = `
                    <div class="py-2.5 border-b border-slate-100 last:border-0 flex justify-between items-center gap-2">
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-slate-800 text-sm truncate">
                                ${item.deskripsi} <span class="text-xs font-normal text-slate-500">(${item.akun} • ${item.jenis})</span>
                            </div>
                            <div class="text-xs text-slate-400 font-mono mt-0.5">${item.waktu}</div>
                        </div>
                        <div class="font-bold ${colorClass} text-sm whitespace-nowrap">
                            ${sign}${formatRupiah(item.nominal)}
                        </div>
                        <button onclick="hapusTransaksi(${item.id})" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold text-xs rounded-xl transition-transform shadow-sm">
                            Hapus
                        </button>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // Hapus Transaksi (Hanya berlaku untuk transaksi hari ini yang tampil)
        function hapusTransaksi(id) {
            // Pengecekan keamanan tanggal di background
            const item = transaksiData.find(t => t.id === id);
            const todayISO = getTodayISOString();

            if (item && item.tanggalISO !== todayISO) {
                showToast("Transaksi tanggal lalu sudah terkunci.");
                return;
            }

            transaksiData = transaksiData.filter(t => t.id !== id);
            saveData();
            renderSemuaData();
            renderHariIni();
            showToast("Transaksi berhasil dihapus.");
        }

        // Proses Closing
        function prosesClosing() {
            const now = new Date();
            const formatWaktu = `${getTodayISOString()} ${now.toTimeString().split(' ')[0]}`;
            statusClosingText = `Tutup hari dilakukan pada: ${formatWaktu}`;
            localStorage.setItem('app_status_closing', statusClosingText);
            document.getElementById('status-closing').innerText = statusClosingText;
            showToast("Daily closing berhasil disimpan!");
        }
    </script>
</body>
</html>
